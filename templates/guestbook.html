{% extends "_base.html" %}

{% block content %}
<div class="guestbook-wrapper" style="max-width: 800px; margin: 0 auto; padding: 20px;">
    <h1>{{ page.title }}</h1>

    <div class="nav-buttons" style="margin-bottom: 20px; text-align: center;">
        <span class="home-button"><a href="{{ get_url(path='') }}">[Home]</a></span>
    </div>    
    
    <div class="page-content" style="margin-bottom: 20px; text-align: center;">
        {{ page.content | safe }}
    </div>

    <!-- Wklejka Atabook -->
    <iframe 
        src="https://majkelspace.atabook.org/" 
        width="100%" 
        height="750px" 
        style="border: none; background: transparent;" 
        frameborder="0">
    </iframe>
</div>
{% endblock content %}
