{% extends "_base.html" %}

{% block content %}
<div class="guestbook-wrapper" style="max-width: 800px; margin: 0 auto; padding: 20px;">
    <h1>{{ page.title }}</h1>

    <div class="nav-buttons" style="margin-bottom: 20px;">
        <span class="home-button"><a href="{{ get_url(path='') }}">[Home]</a></span>
    </div>    
    
    <div class="page-content" style="margin-bottom: 30px;">
        {{ page.content | safe }}
    </div>

    <!-- Kontener CommentBox -->
    <div class="commentbox"></div>

    <!-- Skrypt CommentBox -->
    <script src="https://unpkg.com/commentbox.io/dist/commentBox.min.js"></script>
    <script>
        commentBox('5702084942888960-proj', {
            className: 'commentbox', // domyślna klasa
            defaultBoxId: 'guestbook', // identyfikator księgi
            backgroundColor: '#000000', // tło pola
            textColor: '#ffffff', // kolor tekstu
            subtextColor: '#aaaaaa', // kolor podpisów/dat
            fadeEffect: true
        });
    </script>
</div>
{% endblock content %}
