{% extends "blog-base.html" %}

{% block title %}{{ page.title }} - moggnetwork{% endblock title %}

{% block content %}
<article class="post-page">

    
    <div class="nav-buttons">
        <span class="home-button"><a href="{{ get_url(path='index') }}">[Home]</a></span>
        <span class="blog-button"><a href="{{ get_url(path='blog') }}">[Blog]</a></span>
    </div>

    <header class="post-header">
        <h1>{{ page.title }}</h1>
        <div class="post-meta">
            {{ page.date | date(format="%Y-%m-%d") }}
        </div>
    </header>

    <!-- TYLKO TEN KONTENER BĘDZIE SIĘ PRZEWIJAŁ -->
    <div class="post-content">
        {{ page.content | safe }}
    </div>

</article>
{% endblock content %}
